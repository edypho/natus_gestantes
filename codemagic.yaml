# Pipeline de build iOS — Natus
# Instruções completas no GUIA_PUBLICACAO_IOS.md

workflows:
  ios-release:
    name: iOS Release (TestFlight / App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: NatusAppleKey
    environment:
      groups:
        - ios_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.natusgestantes.app
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependências
        script: flutter pub get
      - name: Configurar chave do Google Maps
        script: |
          if [ -z "$GOOGLE_MAPS_IOS_API_KEY" ]; then
            echo "Configure GOOGLE_MAPS_IOS_API_KEY como variável secreta no Codemagic."
            exit 1
          fi
          printf 'GOOGLE_MAPS_IOS_API_KEY=%s\n' "$GOOGLE_MAPS_IOS_API_KEY" > ios/Flutter/Secrets.xcconfig
      - name: Análise estática
        script: flutter analyze
      - name: Testes
        script: flutter test
      - name: Configurar assinatura
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.natusgestantes.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-check:
    name: iOS Check (sem assinatura, não precisa de conta Apple)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependências
        script: flutter pub get
      - name: Análise estática
        script: flutter analyze
      - name: Testes
        script: flutter test
      - name: Build sem assinatura
        script: flutter build ios --release --no-codesign
    artifacts:
      - /tmp/xcodebuild_logs/*.log
